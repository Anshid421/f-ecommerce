{% load static %}
<!DOCTYPE html>
<html>
<head>
<title>Signup</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{% static 'css/sin.css' %}">
</head>

<body>

<div class="container">

<h2>Sign Up</h2>



<form method="POST">
{% csrf_token %}

<label>Username</label>
{{ form.username }}

<label>Password</label>
{{ form.password1 }}

<label>Confirm Password</label>
{{ form.password2 }}

<button type="submit">Sign Up</button>

</form>

<p>Already have account?
<a href="{% url 'Login' %}">Login</a>
</p>

</div>

</body>
</html>
