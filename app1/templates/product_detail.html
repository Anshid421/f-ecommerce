{% extends "base.html" %}
{% load static %}

{% block title %}
Product Details
{% endblock %}

{% block page_css %}
<link rel="stylesheet" href="{% static 'css/product_detail.css' %}">
{% endblock %}

{% block content %}

<div class="product-detail-container">

    <!-- Left img -->
    <div class="product-image">
        <img src="{{ product.image.url }}" alt="{{ product.name }}">
    </div>

    <!-- Rigt dtls -->
    <div class="product-info">

        <h1>{{ product.name }}</h1>

        <h3 class="price">₹ {{ product.price }}</h3>

        <p class="desc">
            {{ product.description }}
        </p>


        <!-- btns -->
        <div class="actions">

            <a href="{% url 'add_cart' product.id %}" class="btn cart">
                Add to Cart 🛒
            </a>

            <a href="{% url 'buy_now' product.id %}" class="btn buy">
                Buy Now ⚡
            </a>

            <a href="{% url 'add_wishlist' product.id %}"  class="btn wish">
                ❤️ Wishlist
            </a>

        </div>

    </div>

</div>

{% endblock content %}
