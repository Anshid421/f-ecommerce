{% load static %}
<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{% static 'css/login.css' %}">

</head>
<body>

<div class="auth-wrapper">
    <div class="container">

        <h2>Login</h2>
        

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Login</button>
        </form>

        <p>No account?
            <a href="{% url 'signup' %}">Create account</a>
        </p>

    </div>
</div>

</body>
</html>
